name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # nightly: 5.0.0-preview.1 lacks @:js.import
      - name: Install haxe
        uses: krdlab/setup-haxe@v2.1.1
        with:
          haxe-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          haxe --version
          haxelib dev lit .
          haxelib git utest https://github.com/haxe-utest/utest
          npm ci

      - name: Run tests
        run: npm test

      - name: Build demo
        run: npm run build:demo:release
